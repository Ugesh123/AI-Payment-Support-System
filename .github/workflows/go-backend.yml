name: Go backend

on:
  push:
    paths: ["backend/**", ".github/workflows/go-backend.yml"]
  pull_request:
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -race -count=1 ./...
